schema_version = 1

[backlog]
mode = "shadow"
automated_apply = false
automated_close = false
allowed_effects = ["create", "dedupe", "rank", "block"]
proposal_only_effects = ["close"]

[evidence]
network = false
timeout_seconds = 60
max_output_bytes = 1048576
capture_temporary_workspace = true

[authority]
source_writes = false
git_mutation = false
policy_edits = false
packaging = false
deployment = false
release = false
