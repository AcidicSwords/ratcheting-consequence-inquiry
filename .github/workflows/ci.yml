name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  base:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.18"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --dev
      - run: uv run python -c "import rci"
      - run: uv run pytest -q -m "not optional"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src/rci tests
      - run: uv run pytest -q tests/acceptance
      - run: uv run pytest -q tests/acceptance/test_g2a_retrieval_recovery.py
      - run: uv run pytest -q tests/acceptance/test_g2b_consolidation_plasticity.py
      - run: uv run rci --help
      - run: uv build

  extras:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.18"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --all-extras --dev
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build --tag rci-ci:local .
      - run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=64m rci-ci:local
