[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ratcheting-consequence-inquiry"
version = "0.3.1"
description = "An offline-first reference implementation of Ratcheting Consequence Inquiry"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "RCI contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.12,<3",
  "typer>=0.16,<1",
]

[project.scripts]
rci = "rci.cli:main"

[project.optional-dependencies]
openai = ["openai>=2.0,<3"]
z3 = ["z3-solver==4.16.0.0"]

[dependency-groups]
dev = [
  "hatchling>=1.27,<2",
  "hypothesis>=6.130,<7",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/rci"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --basetemp=.pytest-tmp"
testpaths = ["tests"]
markers = [
  "network: explicitly opt into a live network test (never part of the blocking gate)",
  "optional: requires an installed optional capability extra",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["rci"]
mypy_path = "src"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
